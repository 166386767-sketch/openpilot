name: Sync Upstream to SINAN

on:
  schedule:
    # 每天 08:00 UTC 检查上游更新
    - cron: '0 8 * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SiNan-Z6/openpilot
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: SINAN

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/commaai/openpilot.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Merge upstream/master into SINAN
        id: merge
        run: |
          git checkout SINAN
          if git merge upstream/master -m "Auto-sync: merge upstream master into SINAN ($(date +%Y-%m-%d))"; then
            echo "MERGE_STATUS=success" >> $GITHUB_OUTPUT
          else
            echo "MERGE_STATUS=conflict" >> $GITHUB_OUTPUT
            git merge --abort
            exit 1
          fi

      - name: Push to SINAN
        if: steps.merge.outputs.MERGE_STATUS == 'success'
        run: git push origin SINAN

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream sync failed for SINAN',
              body: '上游 commaai/openpilot:master 与 SINAN 分支发生合并冲突，请手动处理。',
              labels: ['upstream-sync']
            });
